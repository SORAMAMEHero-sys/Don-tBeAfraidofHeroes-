<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>モンスターズ・リベンジ：アプデ版</title>
    <style>
        body { 
            text-align: center; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: sans-serif; 
            touch-action: manipulation; 
            margin: 0; 
            padding: 10px; 
        }
        h1 { color: #ffcc00; font-size: 22px; margin: 10px 0; }
        canvas { 
            border: 4px solid #fff; 
            background: linear-gradient(to bottom, #87CEEB 60%, #8B4513 40%); 
            width: 100%; 
            max-width: 800px; 
            height: 350px; 
            display: block; 
            margin: 0 auto; 
        }
        .screen { display: none; }
        .screen.active { display: block; }
        button { 
            font-size: 16px; 
            padding: 10px 18px; 
            cursor: pointer; 
            background-color: #ffcc00; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            margin: 6px; 
        }
        .unit-btn { 
            width: 75px; 
            height: 75px; 
            font-size: 13px; 
            background-color: #333; 
            color: white; 
            border: 2px solid #555; 
            border-radius: 8px;
            padding: 2px;
            line-height: 1.3;
            vertical-align: top;
        }
        .stage-btn { font-size: 16px; padding: 12px 20px; margin: 8px; background-color: #ff5722; color: white; }
        .up-btn { background-color: #4CAF50; color: white; padding: 6px 12px; font-size: 13px; }
        .panel { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; display: inline-block; margin: 5px; width: 95%; max-width: 500px; }
    </style>
</head>
<body>

    <h1>モンスターズ・リベンジ</h1>

    <!-- 1. ステージセレクト画面 -->
    <div id="stageSelectScreen" class="screen active">
        <div class="panel">
            <h2>🗺️ マップ画面</h2>
            <p style="font-size: 18px;">所持XP: <span id="totalXp" style="color: #ffcc00; font-weight: bold;">0</span> XP</p>
            <button onclick="openPowerUpScreen()" style="background-color: #2196F3; color: white;">💪 パワーアップ画面</button>
        </div>
        <hr style="width: 80%; border-color: #444; margin: 15px auto;">
        <h3>ステージを選んでね</h3>
        <div id="stageButtonsContainer"></div>
        <br>
        <button onclick="unlockAllStages()" style="background-color: #607D8B; color: white; font-size: 11px; padding: 6px 10px;">【デバッグ】全ステージ解放</button>
        <button onclick="resetSaveData()" style="background-color: #d9534f; color: white; font-size: 11px; padding: 6px 10px;">セーブ初期化</button>
    </div>

    <!-- 1.5. パワーアップ画面 -->
    <div id="powerUpScreen" class="screen">
        <div class="panel">
            <h2>⚡ パワーアップ (Lv1 ~ 10)</h2>
            <p style="font-size: 18px;">所持XP: <span id="totalXpUp" style="color: #ffcc00; font-weight: bold;">0</span> XP</p>
        </div>
        <div id="powerUpList"></div>
        <br>
        <button onclick="closePowerUpScreen()" style="background-color: #666; color: white;">◀ マップに戻る</button>
    </div>

    <!-- 2. バトル画面 -->
    <div id="battleScreen" class="screen">
        <h2 id="stageTitle" style="font-size: 18px; margin: 5px;">ステージ 1</h2>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <p style="font-size: 18px; font-weight: bold; margin: 8px 0;">所持金: <span id="money" style="color: #ffcc00;">0</span>円</p>
        <div id="unitButtons"></div>
        <br>
        <button onclick="returnToMap()" style="background-color: #d9534f; color: white; font-size: 14px; padding: 8px 15px;">🚪 撤退してマップに戻る</button>
    </div>

    <script>
        // ==========================================
        // 【⚠️ ここから下は基本システム（編集禁止エリア）】
        // セーブキーが固定されているため、データは消えません。
        // ==========================================
        const SAVE_KEY = "monsterGameSave_PERFECT_FIXED";

        let saveData = JSON.parse(localStorage.getItem(SAVE_KEY)) || { 
            maxUnlockedStage: 1, 
            xp: 0, 
            levels: [1, 1, 1, 1, 1] 
        };

        function saveGame() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        function unlockAllStages() {
            saveData.maxUnlockedStage = 5;
            saveGame();
            initStageSelect();
            alert("すべてのステージが解放されました！");
        }

        function resetSaveData() {
            if (confirm("セーブデータを初期化しますか？")) {
                localStorage.removeItem(SAVE_KEY);
                saveData = { maxUnlockedStage: 1, xp: 0, levels: [1, 1, 1, 1, 1] };
                initStageSelect();
                alert("セーブデータを初期化しました！");
            }
        }
        // ==========================================
        // 【⚠️ ここまでシステム領域】
        // ==========================================


        // ==========================================
        // 【✨ ここから下はパラメータ・カスタマイズ自由エリア】
        // ==========================================
        
        // 味方モンスター定義（スズメバチ追加）
        const monsters = [
            { name: "スライム", icon: "🟢", cost: 50, baseHp: 80, speed: 2.0, range: 40, baseAtk: 8, area: false },
            { name: "ゾンビ", icon: "🧟", cost: 120, baseHp: 350, speed: 0.8, range: 40, baseAtk: 12, area: false },
            { name: "ボマー", icon: "💣", cost: 200, baseHp: 40, speed: 3.0, range: 60, baseAtk: 150, area: true },
            { name: "ドラゴン", icon: "🐉", cost: 3000, baseHp: 500, speed: 1.2, range: 250, baseAtk: 50, area: true },
            { name: "スズメバチ", icon: "🐝", cost: 500, baseHp: 1, speed: 3.0, range: 150, baseAtk: 30, area: true }
        ];
        
        // 敵キャラクター定義（ハト助、フクロウ教授追加、自動スケーリング廃止）
        const enemyTemplates = {
            "戦士": { name: "戦士", icon: "⚔️", hp: 120, speed: 1.0, range: 40, atk: 10 },
            "弓使い": { name: "弓使い", icon: "🏹", hp: 70, speed: 1.1, range: 200, atk: 8 },
            "守護騎士": { name: "守護騎士", icon: "🛡️", hp: 400, speed: 0.4, range: 40, atk: 15 },
            "ハト助": { name: "ハト助", icon: "🐦", hp: 500, speed: 2.0, range: 60, atk: 24 },
            "フクロウ教授": { name: "フクロウ教授", icon: "🦉", hp: 3000, speed: 0.6, range: 40, atk: 30 }
        };
        // ==========================================
        // 【✨ カスタマイズエリアここまで】
        // ==========================================


        let money = 150, playerCastleHP = 1000, maxPlayerCastleHP = 1000;
        let enemyCastleHP = 1000, maxEnemyCastleHP = 1000;
        let gameRunning = false;
        let activeMonsters = [], activeHeroes = [], projectiles = [], effects = [];
        let currentStage = 1, gameLoopId = null;
        let gameTimer = 0; // バトル経過時間（秒）カウント用
        let stageTimerInterval = null;

        function initStageSelect() {
            document.getElementById("totalXp").innerText = saveData.xp;
            const container = document.getElementById("stageButtonsContainer");
            container.innerHTML = "";
            for(let i = 1; i <= 5; i++) {
                let b = document.createElement("button");
                b.className = "stage-btn";
                let reward = i * 200;
                b.innerText = i <= saveData.maxUnlockedStage ? `ステージ ${i} (${reward}XP)` : `ステージ ${i} 🔒`;
                b.disabled = i > saveData.maxUnlockedStage;
                b.onclick = () => startBattle(i);
                container.appendChild(b);
            }
        }

        function openPowerUpScreen() {
            document.getElementById("stageSelectScreen").classList.remove("active");
            document.getElementById("powerUpScreen").classList.add("active");
            document.getElementById("totalXpUp").innerText = saveData.xp;
            
            const list = document.getElementById("powerUpList");
            list.innerHTML = "";
            monsters.forEach((m, i) => {
                let lvl = saveData.levels[i] || 1;
                let cost = lvl * 100;
                let div = document.createElement("div");
                div.style.cssText = "background: rgba(255,255,255,0.05); padding: 10px; margin: 8px auto; max-width: 400px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;";
                div.innerHTML = `
                    <span style="font-size:16px;">${m.icon} ${m.name} (Lv:${lvl}/10)</span>
                    <button class="up-btn" onclick="upgradeUnit(${i})" ${lvl >= 10 ? "disabled style='background:#555;'" : ""}>
                        ${lvl >= 10 ? "MAX" : `強化(${cost}XP)`}
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function closePowerUpScreen() {
            document.getElementById("powerUpScreen").classList.remove("active");
            document.getElementById("stageSelectScreen").classList.add("active");
            initStageSelect();
        }

        function upgradeUnit(index) {
            if(!saveData.levels) saveData.levels = [1,1,1,1,1];
            let lvl = saveData.levels[index];
            let cost = lvl * 100;
            if (lvl < 10 && saveData.xp >= cost) {
                saveData.xp -= cost;
                saveData.levels[index]++;
                saveGame();
                openPowerUpScreen();
            } else if (lvl >= 10) {
                alert("すでに最大レベルです！");
            } else {
                alert("XPが足りません！");
            }
        }

        function initBattleUI() {
            if(!saveData.levels) saveData.levels = [1,1,1,1,1];
            const container = document.getElementById("unitButtons");
            container.innerHTML = "";
            monsters.forEach((m, i) => {
                let lvl = saveData.levels[i] || 1;
                let btn = document.createElement("button");
                btn.className = "unit-btn";
                btn.innerHTML = `<span style="font-size:20px;">${m.icon}</span><br><span style="font-size:11px;">Lv${lvl}</span><br><span style="font-size:10px; color:#ffcc00;">${m.cost}円</span>`;
                btn.onclick = () => spawnMonster(i);
                container.appendChild(btn);
            });
        }

        function spawnMonster(index) {
            let m = monsters[index];
            if (money >= m.cost) {
                money -= m.cost;
                document.getElementById("money").innerText = money;
                
                let lvl = saveData.levels[index] || 1;
                let multiplier = 1 + (lvl - 1) * 0.15;
                
                activeMonsters.push({ 
                    ...m, 
                    hp: m.baseHp * multiplier, 
                    maxHp: m.baseHp * multiplier,
                    atk: m.baseAtk * multiplier, 
                    x: 70 
                });
            }
        }

        function spawnEnemy(key) {
            let template = enemyTemplates[key];
            if(template) {
                activeHeroes.push({ ...template, x: 730, hp: template.hp, maxHp: template.hp });
            }
        }

        // ステージごとの敵出現ウェーブ制御
        function handleStageWaves(sec) {
            if (currentStage === 1) {
                if (sec % 3 === 0) spawnEnemy("戦士");
            } else if (currentStage === 2) {
                if (sec % 4 === 0) spawnEnemy("戦士");
                if (sec % 7 === 0) spawnEnemy("弓使い");
            } else if (currentStage === 3) {
                if (sec % 3 === 0) spawnEnemy("戦士");
                if (sec % 6 === 0) spawnEnemy("弓使い");
                if (sec % 10 === 0) spawnEnemy("守護騎士");
            } else if (currentStage === 4) {
                // ステージ4のルール
                if (sec === 3) spawnEnemy("ハト助");
                if (sec > 0 && sec % 5 === 0) spawnEnemy("守護騎士");
                if (sec > 0 && sec % 12 === 0) spawnEnemy("戦士");
                if (sec > 0 && sec % 20 === 0) spawnEnemy("弓使い");
            } else if (currentStage === 5) {
                // ステージ5 (BOSS) のルール
                if (sec === 6) spawnEnemy("フクロウ教授");
                if (sec === 8 || (sec > 0 && sec % 20 === 0)) spawnEnemy("ハト助");
            }
        }

        // お金自動増加
        setInterval(() => {
            if (!gameRunning) return;
            if (money < 9999) {
                money += 20;
                document.getElementById("money").innerText = money;
            }
        }, 500);

        function updateGame() {
            if (!gameRunning) return;
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, 800, 400);

            ctx.font = "50px Arial";
            ctx.fillText("🏰", 15, 340);
            ctx.fillText("👑", 735, 340);

            const bw = 80, bh = 8;
            ctx.fillStyle = "#555"; ctx.fillRect(15, 260, bw, bh);
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(15, 260, bw * Math.max(0, playerCastleHP / maxPlayerCastleHP), bh);
            ctx.fillStyle = "#555"; ctx.fillRect(715, 260, bw, bh);
            ctx.fillStyle = "#e74c3c"; ctx.fillRect(715, 260, bw * Math.max(0, enemyCastleHP / maxEnemyCastleHP), bh);

            activeMonsters.forEach((m, i) => {
                let target = activeHeroes.find(h => Math.abs(h.x - m.x) < m.range);
                
                if (target) {
                    if (m.area && m.name === "ボマー") {
                        effects.push({ x: m.x, y: 340, t: "💥", life: 15 });
                        activeHeroes.forEach(h => { if (Math.abs(h.x - m.x) < 120) h.hp -= m.atk; });
                        m.hp = 0;
                    } else if (Math.random() < 0.06) {
                        if (m.area) {
                            effects.push({ x: target.x, y: 340, t: "🔥", life: 15 });
                            activeHeroes.forEach(h => { if (Math.abs(h.x - m.x) <= m.range) h.hp -= m.atk; });
                        } else {
                            projectiles.push({ x: m.x, targetX: target.x, col: "#f1c40f", type: "unit" });
                            target.hp -= m.atk;
                        }
                    }
                } else if (m.x < 700) {
                    m.x += m.speed;
                } else {
                    enemyCastleHP -= 0.6;
                }

                ctx.font = "35px Arial";
                ctx.fillText(m.icon, m.x, 340);
            });

            activeHeroes.forEach((h, i) => {
                let target = activeMonsters.find(m => {
                    // ボマー移動中は敵の索外（無敵）にする
                    if (m.name === "ボマー") return false;
                    return Math.abs(m.x - h.x) < h.range;
                });
                
                if (target) {
                    if (Math.random() < 0.06) {
                        projectiles.push({ x: h.x, targetX: target.x, col: "#e74c3c", type: "enemy" });
                        target.hp -= h.atk;
                    }
                } else if (h.x > 70) {
                    h.x -= h.speed;
                } else {
                    playerCastleHP -= 0.6;
                }

                ctx.font = "35px Arial";
                ctx.fillText(h.icon, h.x, 340);
            });

            projectiles.forEach((p, i) => {
                p.x += (p.type === "unit" ? 14 : -14);
                ctx.fillStyle = p.col;
                ctx.fillRect(p.x, 330, 10, 5);
                if (Math.abs(p.x - p.targetX) < 10) {
                    projectiles.splice(i, 1);
                }
            });

            effects.forEach((ef, i) => {
                ctx.font = "40px Arial";
                ctx.fillText(ef.t, ef.x, ef.y);
                ef.life--;
                if (ef.life <= 0) effects.splice(i, 1);
            });

            // 敵を倒したときに300円ドロップする処理
            activeMonsters = activeMonsters.filter(m => {
                if (m.hp <= 0) {
                    effects.push({ x: m.x, y: 340, t: "💀", life: 15 });
                    return false;
                }
                return true;
            });

            activeHeroes = activeHeroes.filter(h => {
                if (h.hp <= 0) {
                    effects.push({ x: h.x, y: 340, t: "💀", life: 15 });
                    money += 300; // 敵撃破時に300円獲得！
                    if (money > 9999) money = 9999;
                    document.getElementById("money").innerText = money;
                    return false;
                }
                return true;
            });

            if (playerCastleHP <= 0 || enemyCastleHP <= 0) {
                gameRunning = false;
                cancelAnimationFrame(gameLoopId);
                clearInterval(stageTimerInterval);
                
                if (enemyCastleHP <= 0) {
                    let rewardXp = currentStage * 200;
                    saveData.xp += rewardXp;
                    alert(`🎉 ステージ ${currentStage} クリア！！\n報酬として ${rewardXp} XP 獲得！`);
                    
                    if (currentStage === saveData.maxUnlockedStage && currentStage < 5) {
                        saveData.maxUnlockedStage++;
                    }
                    saveGame();
                } else {
                    alert("💀 城が陥落しました……敗北です。");
                }
                returnToMap();
                return;
            }

            gameLoopId = requestAnimationFrame(updateGame);
        }

        function startBattle(stageNum) {
            currentStage = stageNum;
            document.getElementById("stageSelectScreen").classList.remove("active");
            document.getElementById("powerUpScreen").classList.remove("active");
            document.getElementById("battleScreen").classList.add("active");
            document.getElementById("stageTitle").innerText = `ステージ ${stageNum}`;
            
            money = 150;
            playerCastleHP = 1000; maxPlayerCastleHP = 1000;
            // ステージ5はボス用に敵城HPをガッツリ強化
            enemyCastleHP = stageNum === 5 ? 4000 : (800 + (stageNum * 500)); 
            maxEnemyCastleHP = enemyCastleHP;
            
            activeMonsters = [];
            activeHeroes = [];
            projectiles = [];
            effects = [];
            gameTimer = 0;
            
            document.getElementById("money").innerText = money;
            initBattleUI();
            
            gameRunning = true;
            
            // 1秒ごとにタイマーを進めてウェーブを管理
            if(stageTimerInterval) clearInterval(stageTimerInterval);
            stageTimerInterval = setInterval(() => {
                if(!gameRunning) return;
                gameTimer++;
                handleStageWaves(gameTimer);
            }, 1000);

            updateGame();
        }

        function returnToMap() {
            gameRunning = false;
            cancelAnimationFrame(gameLoopId);
            if(stageTimerInterval) clearInterval(stageTimerInterval);
            document.getElementById("battleScreen").classList.remove("active");
            document.getElementById("powerUpScreen").classList.remove("active");
            document.getElementById("stageSelectScreen").classList.add("active");
            initStageSelect();
        }

        initStageSelect();
    </script>
</body>
</html>
