<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスターズ・リベンジ：完全版</title>
    <style>
        body { text-align: center; background: #222; color: #fff; font-family: sans-serif; touch-action: manipulation; }
        canvas { border: 4px solid #fff; background: linear-gradient(#87ceeb 60%, #8b4513 40%); width: 90%; max-width: 800px; height: 400px; margin: 0 auto; display: block; }
        button { font-size: 15px; padding: 10px 15px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; font-weight: bold; margin: 5px; }
        .screen { display: none; } .screen.active { display: block; }
        .unit-btn { width: 90px; height: 60px; font-size: 11px; background: #444; color: #fff; }
    </style>
</head>
<body>

    <h1>モンスターズ・リベンジ</h1>

    <!-- マップ画面 -->
    <div id="mapScreen" class="screen active">
        <h2>マップ画面</h2>
        <p>所持XP: <span id="totalXp">0</span> XP</p>
        <button onclick="openPower()" style="background: #ff5722; color: white;">💪 パワーアップ画面</button>
        <hr style="width: 50%; border-color: #444;">
        <h3>ステージを選んでね</h3>
        <div id="stageContainer"></div>
    </div>

    <!-- パワーアップ画面 -->
    <div id="powerScreen" class="screen">
        <h2>パワーアップ (Lv1 ~ 10)</h2>
        <p>所持XP: <span id="powerXp">0</span> XP</p>
        <div id="powerList"></div>
        <br><button onclick="switchScreen('mapScreen')" style="background: #666; color: white;">マップに戻る</button>
    </div>

    <!-- バトル画面 -->
    <div id="battleScreen" class="screen">
        <h2 id="stageTitle">ステージ 1</h2>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <p>お金: <span id="money">0</span>円</p>
        <div id="unitButtons"></div>
        <br><button onclick="returnToMap()" style="background: #d9534f; color: white;">マップに戻る</button>
    </div>

<script>
    // セーブデータ
    let save = JSON.parse(localStorage.getItem("monsterSave")) || { maxStage: 1, xp: 0, levels: [1, 1, 1, 1] };
    function saveGame() { localStorage.setItem("monsterSave", JSON.stringify(save)); }

    // キャラデータ
    const monsters = [
        { name: "スライム", icon: "🟢", cost: 50, hp: 80, spd: 2, range: 40, atk: 5 },
        { name: "ゾンビ", icon: "🧟", cost: 120, hp: 350, spd: 0.8, range: 40, atk: 8 },
        { name: "ボマー", icon: "💣", cost: 200, hp: 40, spd: 3, range: 60, atk: 150, area: true },
        { name: "ドラゴン", icon: "🐉", cost: 3000, hp: 500, spd: 1.2, range: 250, atk: 40, area: true }
    ];
    const heroes = [
        { icon: "⚔️", hp: 100, spd: 1.0, range: 40, atk: 10 },
        { icon: "🏹", hp: 60, spd: 1.2, range: 200, atk: 8 },
        { icon: "🛡️", hp: 350, spd: 0.4, range: 40, atk: 12 }
    ];

    let money = 100, castleP = 1000, castleE = 1000, currentStage = 1, running = false;
    let myUnits = [], enemyUnits = [], bullets = [], fx = [], gameId = null;

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'mapScreen') initMap();
    }

    function initMap() {
        document.getElementById("totalXp").innerText = save.xp;
        let c = document.getElementById("stageContainer"); c.innerHTML = "";
        for (let i = 1; i <= 3; i++) {
            let b = document.createElement("button");
            b.style.fontSize = "18px"; b.style.padding = "10px 20px"; b.style.margin = "5px";
            b.innerText = i <= save.maxStage ? `ステージ ${i} (報酬:${i*100}XP)` : `ステージ ${i} 🔒`;
            b.disabled = i > save.maxStage;
            b.onclick = () => startBattle(i);
            c.appendChild(b);
        }
    }

    function openPower() {
        switchScreen('powerScreen');
        document.getElementById("powerXp").innerText = save.xp;
        let list = document.getElementById("powerList"); list.innerHTML = "";
        monsters.forEach((m, i) => {
            let lvl = save.levels[i]; let cost = lvl * 50;
            let div = document.createElement("div"); div.style.margin = "10px";
            div.innerHTML = `${m.icon} ${m.name} (Lv:${lvl}/10) <button onclick="upgrade(${i})" style="background:#4CAF50;color:#fff;">強化(${cost}XP)</button>`;
            list.appendChild(div);
        });
    }

    function upgrade(i) {
        let cost = save.levels[i] * 50;
        if (save.levels[i] < 10 && save.xp >= cost) {
            save.xp -= cost; save.levels[i]++; saveGame(); openPower();
        } else { alert("XP不足かMAXです！"); }
    }

    function startBattle(stage) {
        currentStage = stage; switchScreen('battleScreen');
        document.getElementById("stageTitle").innerText = "ステージ " + stage;
        money = 150; castleP = 1000; castleE = 800 + (stage * 400);
        myUnits = []; enemyUnits = []; bullets = []; fx = [];
        
        // ユニットボタン生成
        let uCont = document.getElementById("unitButtons"); uCont.innerHTML = "";
        monsters.forEach((m, idx) => {
            let btn = document.createElement("button");
            btn.className = "unit-btn";
            btn.innerHTML = `${m.icon} ${m.name}<br>Lv${save.levels[idx]}<br>${m.cost}円`;
            btn.onclick = () => {
                if (money >= m.cost) {
                    money -= m.cost;
                    let mul = 1 + (save.levels[idx] - 1) * 0.1;
                    myUnits.push({ ...m, hp: m.hp * mul, atk: m.atk * mul, x: 70 });
                }
            };
            uCont.appendChild(btn);
        });

        running = true;
        loop();
    }

    // 敵定期生成
    setInterval(() => {
        if (!running) return;
        let h = heroes[Math.floor(Math.random() * heroes.length)];
        enemyUnits.push({ ...h, x: 730, hp: h.hp + (currentStage * 20) });
    }, 2500);

    // お金自動増加
    setInterval(() => {
        if (!running || money >= 9999) return;
        money += 20;
    }, 500);

    function loop() {
        if (!running) return;
        const ctx = document.getElementById("gameCanvas").getContext("2d");
        ctx.clearRect(0, 0, 800, 400);

        // 拠点描画
        ctx.font = "50px Arial";
        ctx.fillText("🏰", 20, 340);
        ctx.fillText("👑", 730, 340);
        document.getElementById("money").innerText = money;

        // 味方更新
        myUnits.forEach((m, i) => {
            let target = enemyUnits.find(e => Math.abs(e.x - m.x) < m.range);
            if (target) {
                if (m.area) {
                    fx.push({ x: m.x, y: 340, t: "💥", life: 15 });
                    enemyUnits.forEach(e => { if (Math.abs(e.x - m.x) < 100) e.hp -= m.atk; });
                    myUnits.splice(i, 1);
                    return;
                }
                if (Math.random() < 0.05) {
                    bullets.push({ x: m.x, targetX: target.x, col: "yellow", type: "unit" });
                    target.hp -= m.atk;
                }
            } else if (m.x < 700) {
                m.x += m.spd;
            } else {
                castleE -= 0.5;
            }
            ctx.font = "35px Arial";
            ctx.fillText(m.icon, m.x, 340);
        });

        // 敵更新
        enemyUnits.forEach((e, i) => {
            let target = myUnits.find(m => Math.abs(m.x - e.x) < e.range);
            if (target) {
                if (Math.random() < 0.05) {
                    bullets.push({ x: e.x, targetX: target.x, col: "red", type: "enemy" });
                    target.hp -= e.atk;
                }
            } else if (e.x > 70) {
                e.x -= e.spd;
            } else {
                castleP -= 0.5;
            }
            ctx.font = "35px Arial";
            ctx.fillText(e.icon, e.x, 340);
        });

        // 死亡・消滅処理
        myUnits = myUnits.filter(m => m.hp > 0);
        enemyUnits = enemyUnits.filter(e => {
            if (e.hp <= 0) { fx.push({ x: e.x, y: 340, t: "💀", life: 15 }); return false; }
            return true;
        });

        // 弾描画
        bullets.forEach((b, i) => {
            b.x += (b.type === "unit" ? 12 : -12);
            ctx.fillStyle = b.col;
            ctx.fillRect(b.x, 330, 10, 5);
            if (Math.abs(b.x - b.targetX) < 10) bullets.splice(i, 1);
        });

        // エフェクト描画
        fx.forEach((f, i) => {
            ctx.font = "40px Arial";
            ctx.fillText(f.t, f.x, f.y);
            f.life--;
            if (f.life <= 0) fx.splice(i, 1);
        });

        // 勝敗判定
        if (castleP <= 0 || castleE <= 0) {
            running = false;
            if (castleE <= 0) {
                let reward = currentStage * 100;
                save.xp += reward;
                if (currentStage === save.maxStage && currentStage < 3) save.maxStage++;
                saveGame();
                alert(`ステージ ${currentStage} クリア！ 報酬 ${reward}XP 獲得！`);
            } else {
                alert("敗北しました...");
            }
            returnToMap();
            return;
        }

        gameId = requestAnimationFrame(loop);
    }

    function returnToMap() {
        running = false;
        cancelAnimationFrame(gameId);
        switchScreen('mapScreen');
    }

    initMap();
</script>
</body>
</html>
