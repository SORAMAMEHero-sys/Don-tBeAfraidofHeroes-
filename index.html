<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>モンスターズ・リベンジ (Monster's Revenge)</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #ffcc00; }
        #game-container {
            display: inline-block;
            background-color: #333;
            border: 4px solid #555;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background: linear-gradient(to bottom, #2b3e50, #4ca1af);
            display: block;
            margin: 0 auto;
            border: 2px solid #222;
        }
        .panel {
            margin-top: 10px;
            background: #222;
            padding: 10px;
            border-radius: 5px;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 8px 14px;
            margin: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover { background-color: #d35400; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .stage-btn { background-color: #2980b9; }
        .stage-btn:hover { background-color: #1f618d; }
    </style>
</head>
<body>

    <h1>モンスターズ・リベンジ</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="300"></canvas>
        
        <div class="panel" id="ui-panel">
            <div>
                ステージ: <span id="current-stage">1</span> | 
                所持金: <span id="money">100</span> XP | 
                城HP: <span id="castle-hp">1000</span>/<span id="castle-max-hp">1000</span>
            </div>
            <div id="unit-buttons" style="margin-top:8px;"></div>
            <div style="margin-top:8px;">
                <button onclick="changeStage(-1)">前のステージ</button>
                <button onclick="changeStage(1)">次のステージ</button>
                <button onclick="startBattle()" style="background-color: #27ae60;">バトル開始！</button>
                <button onclick="returnToMenu()" style="background-color: #7f8c8d;">メニューに戻る</button>
            </div>
        </div>
    </div>

<script>
// --- Web Audio API 効果音ジェネレーター ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === "spawn") {
        // キャラ召喚音（ポコン♪）
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gainNode.gain.setValueAtTime(0.2, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
    } else if (type === "boss") {
        // ボス登場音（不穏な警告音風）
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(100, now + 0.15);
        gainNode.gain.setValueAtTime(0.3, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
    } else if (type === "defeat") {
        // 敵撃破音（キィン！）
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        gainNode.gain.setValueAtTime(0.15, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    }
}

// --- ゲームデータ・変数 ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameState = "MENU"; // MENU または BATTLE
let currentStageNum = 1;
let maxUnlockedStage = 1;
let money = 100;
let maxMoney = 1000;
let castleHp = 1000;
let castleMaxHp = 1000;

// ユニット定義 (Lv 1〜10対応、アンロック管理)
const units = [
    { name: "スライム", cost: 50, hp: 150, atk: 25, speed: 1.5, cd: 60, range: 25, unlocked: true, level: 1 },
    { name: "ゾンビ", cost: 120, hp: 300, atk: 40, speed: 1.0, cd: 120, range: 30, unlocked: true, level: 1 },
    { name: "ボマー", cost: 200, hp: 200, atk: 120, speed: 0.8, cd: 180, range: 40, unlocked: true, level: 1 },
    { name: "タンクロン", cost: 250, hp: 800, atk: 30, speed: 0.5, cd: 240, range: 35, unlocked: true, level: 1 },
    { name: "タンクムーン", cost: 300, hp: 700, atk: 35, speed: 0.4, cd: 250, range: 35, unlocked: true, level: 1, skill: "highSpeedResist" },
    { name: "ハチ", cost: 150, hp: 100, atk: 50, speed: 2.5, cd: 150, range: 50, unlocked: false, unlockCost: 3000, level: 1, skill: "projectileImmune" },
    { name: "ドラゴン", cost: 500, hp: 500, atk: 200, speed: 0.7, cd: 360, range: 180, unlocked: false, unlockCost: 5000, level: 1 }
];

// 敵テンプレート
const enemyTemplates = {
    "雑魚": { name: "雑魚", hp: 200, atk: 20, speed: 1.0, range: 25, color: "#e74c3c" },
    "ガウ": { name: "ガウ", hp: 400, atk: 45, speed: 1.8, range: 25, color: "#c0392b" },
    "フクロウ教授": { name: "フクロウ教授", hp: 2500, atk: 150, speed: 0.8, range: 120, color: "#8e44ad", isBoss: true },
    "メェーラム": { name: "メェーラム", hp: 800, atk: 5000, speed: 4.3, range: 20, color: "#111111" }
};

let activeUnits = [];
let activeEnemies = [];
let coolDowns = {};
let stageTimer = 0;
let bossSpawned = false;

// ユニットのステータス計算（レベル補正）
function getUnitStats(u) {
    let mult = 1 + (u.level - 1) * 0.15;
    return {
        hp: Math.floor(u.hp * mult),
        atk: Math.floor(u.atk * mult)
    };
}

// 画面初期化
function initUI() {
    let container = document.getElementById("unit-buttons");
    container.innerHTML = "";
    
    units.forEach((u, index) => {
        if (!u.unlocked) return; // 未解放はスキップ
        let stats = getUnitStats(u);
        let btn = document.createElement("button");
        btn.id = `unit-btn-${index}`;
        btn.innerHTML = `${u.name} (Lv.${u.level})<br>コスト:${u.cost} / HP:${stats.hp}`;
        btn.onclick = () => spawnUnit(index);
        container.appendChild(btn);
    });

    document.getElementById("current-stage").innerText = currentStageNum;
    document.getElementById("money").innerText = money;
    document.getElementById("castle-hp").innerText = castleHp;
    document.getElementById("castle-max-hp").innerText = castleMaxHp;
}

function changeStage(dir) {
    currentStageNum += dir;
    if (currentStageNum < 1) currentStageNum = 1;
    if (currentStageNum > 7) currentStageNum = 7;
    document.getElementById("current-stage").innerText = currentStageNum;
}

function startBattle() {
    gameState = "BATTLE";
    activeUnits = [];
    activeEnemies = [];
    money = 100;
    stageTimer = 0;
    bossSpawned = false;
    
    // ステージごとの城HP設定
    castleMaxHp = 1000 + (currentStageNum - 1) * 300;
    castleHp = castleMaxHp;

    coolDowns = {};
    units.forEach((_, i) => coolDowns[i] = 0);
}

function returnToMenu() {
    gameState = "MENU";
    initUI();
}

function spawnUnit(index) {
    let u = units[index];
    if (money >= u.cost && (coolDowns[index] || 0) <= 0) {
        money -= u.cost;
        coolDowns[index] = u.cd;
        playSound("spawn"); // 召喚音再生！

        let stats = getUnitStats(u);
        activeUnits.push({
            name: u.name,
            x: 80,
            y: 220,
            hp: stats.hp,
            maxHp: stats.hp,
            atk: stats.atk,
            speed: u.speed,
            range: u.range,
            skill: u.skill || null,
            color: "#3498db"
        });
    }
}

// ステージごとの敵ウェーブ管理
function updateStageWaves() {
    stageTimer++;

    // ステージ5のボス (フクロウ教授)
    if (currentStageNum === 5 && stageTimer === 120 && !bossSpawned) {
        bossSpawned = true;
        activeEnemies.push({ ...enemyTemplates["フクロウ教授"], x: 720, y: 220, maxHp: enemyTemplates["フクロウ教授"].hp });
        playSound("boss"); // ボス登場音再生！
    }

    // ステージ7のボス (メェーラム / ブラックマ枠)
    if (currentStageNum === 7 && stageTimer === 60 && !bossSpawned) {
        bossSpawned = true;
        activeEnemies.push({ ...enemyTemplates["メェーラム"], x: 720, y: 220, maxHp: enemyTemplates["メェーラム"].hp });
        playSound("boss"); // ボス登場音再生！
    }

    // 通常雑魚ウェーブ
    if (stageTimer % 200 === 0) {
        let enemyType = currentStageNum >= 3 ? "ガウ" : "雑魚";
        let template = enemyTemplates[enemyType];
        activeEnemies.push({ ...template, x: 720, y: 220, maxHp: template.hp });
    }
}

// メインゲームループ
function update() {
    if (gameState === "BATTLE") {
        // お金自動増加
        if (money < maxMoney && Math.random() < 0.1) money++;

        // クールダウン減少
        for (let i in coolDowns) {
            if (coolDowns[i] > 0) coolDowns[i]--;
        }

        updateStageWaves();

        // ユニットの移動・戦闘
        activeUnits.forEach(u => {
            let blocked = false;
            activeEnemies.forEach(e => {
                if (Math.abs(u.x - e.x) <= u.range) {
                    blocked = true;
                    e.hp -= u.atk / 30; // 毎フレームのダメージ換算
                }
            });
            if (!blocked) {
                u.x += u.speed;
            }
        });

        // 敵の移動・戦闘
        activeEnemies.forEach(e => {
            let blocked = false;
            activeUnits.forEach(u => {
                if (Math.abs(e.x - u.x) <= u.range) {
                    blocked = true;
                    
                    // スキル判定：タンクムーンの高速敵ダメージ軽減 (速度2.0以上から40%カット)
                    let dmg = e.atk / 30;
                    if (u.skill === "highSpeedResist" && e.speed >= 2.0) {
                        dmg *= 0.6;
                    }
                    u.hp -= dmg;
                }
            });

            if (!blocked) {
                if (e.x > 100) {
                    e.x -= e.speed;
                } else {
                    // 城攻撃
                    castleHp -= e.atk / 30;
                    if (castleHp <= 0) {
                        gameState = "GAMEOVER";
                    }
                }
            }
        });

        // 死亡判定と敵撃破音
        let initialEnemyCount = activeEnemies.length;
        activeEnemies = activeEnemies.filter(e => {
            if (e.hp <= 0) {
                money += 30; // 撃破報酬
                return false;
            }
            return true;
        });
        
        // 敵が減った（＝倒された）時に効果音を鳴らす
        if (activeEnemies.length < initialEnemyCount) {
            playSound("defeat");
        }

        activeUnits = activeUnits.filter(u => u.hp > 0);
    }
}

// 描画処理
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "MENU") {
        ctx.fillStyle = "#ffcc00";
        ctx.font = "24px 'Courier New'";
        ctx.fillText("ステージを選択して「バトル開始！」を押してね", 120, 130);
        return;
    }

    if (gameState === "BATTLE" || gameState === "GAMEOVER") {
        // 背景・城の描画
        ctx.fillStyle = "#8e44ad";
        ctx.fillRect(20, 160, 60, 100); // 味方城
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(720, 160, 60, 100); // 敵城

        // HPバー
        ctx.fillStyle = "#fff";
        ctx.font = "12px sans-serif";
        ctx.fillText(`城 HP: ${Math.max(0, Math.floor(castleHp))}`, 20, 150);

        // 味方ユニット描画
        activeUnits.forEach(u => {
            ctx.fillStyle = u.color;
            ctx.beginPath();
            ctx.arc(u.x, u.y, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // HPバー
            ctx.fillStyle = "red";
            ctx.fillRect(u.x - 15, u.y - 24, 30, 4);
            ctx.fillStyle = "green";
            ctx.fillRect(u.x - 15, u.y - 24, 30 * (u.hp / u.maxHp), 4);

            ctx.fillStyle = "#fff";
            ctx.font = "10px sans-serif";
            ctx.fillText(u.name, u.x - 18, u.y + 26);
        });

        // 敵描画
        activeEnemies.forEach(e => {
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.isBoss ? 20 : 14, 0, Math.PI * 2);
            ctx.fill();

            // HPバー
            ctx.fillStyle = "red";
            ctx.fillRect(e.x - 15, e.y - (e.isBoss ? 30 : 24), 30, 4);
            ctx.fillStyle = "green";
            ctx.fillRect(e.x - 15, e.y - (e.isBoss ? 30 : 24), 30 * (e.hp / e.maxHp), 4);

            ctx.fillStyle = "#fff";
            ctx.font = "10px sans-serif";
            ctx.fillText(e.name, e.x - 18, e.y + 26);
        });

        if (gameState === "GAMEOVER") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#e74c3c";
            ctx.font = "40px 'Courier New'";
            ctx.fillText("GAME OVER", 280, 140);
            ctx.fillStyle = "#fff";
            ctx.font = "18px 'Courier New'";
            ctx.fillText("「メニューに戻る」を押してね", 260, 180);
        }
    }

    // UIのリアルタイム更新
    document.getElementById("money").innerText = Math.floor(money);
    document.getElementById("castle-hp").innerText = Math.max(0, Math.floor(castleHp));
    
    units.forEach((u, i) => {
        let btn = document.getElementById(`unit-btn-${i}`);
        if (btn && u.unlocked) {
            let cd = coolDowns[i] || 0;
            if (cd > 0) {
                btn.innerText = `${u.name} (CD:${Math.ceil(cd/30)}s)`;
                btn.disabled = true;
            } else if (money < u.cost) {
                btn.innerText = `${u.name} (金不足)`;
                btn.disabled = true;
            } else {
                let stats = getUnitStats(u);
                btn.innerHTML = `${u.name} (Lv.${u.level})<br>コスト:${u.cost} / HP:${stats.hp}`;
                btn.disabled = false;
            }
        }
    });
}

// ゲームループ駆動 (しっかり修正！)
setInterval(() => {
    update();
    draw();
}, 1000 / 30);

// 初期起動
initUI();
</script>
</body>
</html>
